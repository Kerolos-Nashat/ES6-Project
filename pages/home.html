<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light px-4">
    <a class="navbar-brand" href="#">Smart Store</a>

    <div class="ms-auto">
        <span id="username" class="me-3"></span>
        <a href="cart.html" class="btn btn-outline-primary me-2">Cart</a>
      <button class="btn btn-danger" onclick="logout()">
         Logout
     </button>

    </div>
</nav>

<div class="container my-4">
   <div class="slider">
    <button class="prev">‹</button>

    <div class="slides">
        <img src="../img/img1.jpg" class="slide active">
        <img src="../img/img2.jpg" class="slide">
        <img src="../img/img3.jpg" class="slide">
    </div>

    <button class="next">›</button>
</div>

</div>

<div class="d-flex gap-2 mb-4">
    <button class="btn btn-outline-dark" onclick="sortByPrice()">Price</button>

    <button class="btn btn-outline-dark" onclick="filterBySize('S')">S</button>
    <button class="btn btn-outline-dark" onclick="filterBySize('M')">M</button>
    <button class="btn btn-outline-dark" onclick="filterBySize('L')">L</button>

    <button class="btn btn-outline-dark" onclick="filterByCategory('men\'s clothing')">
        Clothes
    </button>

    <button class="btn btn-outline-dark" onclick="showAll()">All</button>
</div>

<div class="container">
    <h4 class="mb-3">Our Products</h4>
    <div class="row" id="products"></div>
</div>

<script src="../js/products.js"></script>
<script src="../js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
