<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Login</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="site-header mb-4">
    <div class="container d-flex align-items-center justify-content-between">
        <div class="brand"><a href="home.html">Smart Store</a></div>
        <div class="nav-actions"><a href="home.html" class="btn btn-link small">Home</a></div>
    </div>
</header>

<main class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="auth-card w-100">
        <h3 class="text-center mb-3">Welcome back</h3>
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label small text-muted">Email</label>
                <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label small text-muted">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Password" required>
            </div>
            <p id="error" class="text-danger small"></p>
            <div class="d-flex justify-content-between align-items-center mb-2">
                <a href="register.html" class="small">Create account</a>
                <button class="btn btn-primary">Login</button>
            </div>
        </form>
    </div>
</main>

<footer class="site-footer">
    <div class="container d-flex justify-content-between">
        <div class="small text-muted">Need help? contact@smartstore.example</div>
        <div class="small text-muted">© <span id="yearLogin"></span> Smart Store</div>
    </div>
</footer>

<script>document.getElementById('yearLogin').textContent=new Date().getFullYear();</script>
<script src="../js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
