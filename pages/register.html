<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

   
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card p-5" style="width: 400px;">
        <h3 class="text-center mb-3">Register</h3>

        <form id="registerForm">
            <input type="text" id="name" class="form-control mb-3" placeholder="Enter Name">
            <input type="email" id="email" class="form-control mb-3" placeholder="Enter Email">
            <input type="password" id="password" class="form-control mb-3" placeholder="Enter Password">
            <input type="password" id="confirm" class="form-control mb-3" placeholder="Confirm Password">

            <p id="error" class="text-danger small"></p>
            <a href="login.html" class="text-decoration-none">Login</a>
            <button class="btn btn-primary w-100 mt-2">Register</button>
        </form>
    </div>
</div>

<script src="../js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
