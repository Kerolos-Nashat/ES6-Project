<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card p-5" style="width: 400px;">
        <h3 class="text-center mb-3">Login</h3>

        <form id="loginForm">
            <input type="email" id="email" class="form-control mb-2" placeholder="Enter Email">
            <input type="password" id="password" class="form-control mb-2" placeholder="Enter Password">

            <p id="error" class="text-danger small"></p>
<a href="register.html" class="text-decoration-none">Register</a>
            <button class="btn btn-primary w-100">Login</button>
        </form>
    </div>
</div>

<script src="../js/auth.js"></script>
</body>
</html>
