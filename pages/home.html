<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Home</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css">
        <link rel="icon" href="../img/logo.png">
        <meta name="description" content="Smart Store — curated products with a clean shopping experience">
        <style>body{padding-top:18px}</style>
</head>
<body>

<header class="site-header py-3 mb-4">
    <div class="container d-flex align-items-center justify-content-between">
        <div class="brand">
            <img src="../img/logo.png" alt="logo" onerror="this.style.display='none'">
            <a href="home.html" style="text-decoration:none;color:inherit">Smart Store</a>
        </div>

        <div class="d-flex align-items-center gap-3 nav-actions">
            <input class="form-control search-input" placeholder="Search products..." id="siteSearch">
            <a href="cart.html" class="btn btn-outline-primary">Cart</a>
            <span id="username" class="text-muted"></span>
        </div>
    </div>
</header>

<main class="container">
    <section class="hero mb-4">
        <div class="position-relative">
            <button class="prev">‹</button>
            <div class="slides">
                <img src="../img/img1.jpg" class="slide active" alt="slide 1">
                <img src="../img/img2.jpg" class="slide" alt="slide 2">
                <img src="../img/img3.jpg" class="slide" alt="slide 3">
            </div>
            <button class="next">›</button>
        </div>
    </section>

    <section class="mb-3 d-flex align-items-center justify-content-between filters">
        <div>
            <button class="btn btn-sm btn-outline-secondary" onclick="sortByPrice()">Sort: Price</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="filterByCategory('men\'s clothing')">Clothes</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="showAll()">Show All</button>
        </div>
    </section>

    <section>
        <h4 class="mb-3">Our Products</h4>
        <div class="row g-3" id="products"></div>
    </section>
</main>

<footer class="site-footer">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <strong>Smart Store</strong>
            <div class="small text-muted">Quality goods — fast shipping</div>
        </div>
        <nav class="small text-muted">© <span id="year"></span> Smart Store</nav>
    </div>
</footer>

<script>document.getElementById('year').textContent=new Date().getFullYear();</script>
<script src="../js/products.js"></script>
<script src="../js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
