<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Shipped</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <script>
        // Prevent direct access to this page unless a purchase was just made (session-only)
        if (sessionStorage.getItem('hasPurchased') !== 'true') {
            // use replace so user can't use back to bypass
            location.replace('./cart.html');
        } else {
            // consume the flag so user can't revisit shipped page without a new purchase
            sessionStorage.removeItem('hasPurchased');
        }
    </script>

<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="text-center">
        <h2 class="text-success">✅Order Shipped</h2>
        <p>Your order has been placed successfully</p>
        <a href="home.html" class="btn btn-primary">Back to Home</a>
    </div>
</div>
    <script>
        // Prevent direct access to this page unless a purchase was just made (session-only)
        if (sessionStorage.getItem('hasPurchased') !== 'true') {
            window.location.href = 'cart.html';
        } else {
            // consume the flag so user can't revisit shipped page without a new purchase
            sessionStorage.removeItem('hasPurchased');
        }
    </script>
</body>
</html>
